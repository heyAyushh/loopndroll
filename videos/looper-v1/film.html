<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<script>
// Looper launch film. One room, one fixed camera, five 8-bar loops.
// Every frame is a pure function of its frame index (renderFrame), so the render is reproducible.

const WIDTH = 1920;
const HEIGHT = 1080;
const FPS = 30;
const BPM = 128;
const BEAT = 60 / BPM;
const BAR = BEAT * 4;
const DURATION = 40 * BAR; // 75s
const LETTERBOX = Math.round((HEIGHT - WIDTH / 2.39) / 2);
const MONO = '"SF Mono", Menlo, monospace';
const SANS = '-apple-system, "SF Pro Display", "Helvetica Neue", sans-serif';

const COLOR = {
  ink: "#060609",
  silhouette: "#040406",
  moon: [150, 160, 230],
  screen: [185, 195, 255],
  accent: [185, 164, 255],
  running: [127, 224, 164],
  dawn: [255, 196, 140],
};

// Story beats in seconds, straight from the bar grid (mirrors score.py).
const at = (bar, beat = 0) => bar * BAR + beat * BEAT;
const T = {
  stop: at(6), insertMonitorEnd: at(8), leaveDesk: at(10), stopsMultiply: at(12),
  pressure: at(16), phoneBuzz: at(20), crisis: at(23), reply: at(23, 0.9), send: at(23, 3.1),
  climax: at(24), dawn: at(32), wake: at(34), endCard: at(36),
};

// ---------- deterministic helpers ----------
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (edge0, edge1, x) => { const k = clamp((x - edge0) / (edge1 - edge0)); return k * k * (3 - 2 * k); };
const window01 = (t, start, end, fade = 0.6) => smooth(start - fade, start, t) * (1 - smooth(end - fade, end, t));
const rgba = ([r, g, b], a) => `rgba(${r},${g},${b},${clamp(a)})`;
const mix = (c1, c2, k) => c1.map((v, i) => Math.round(lerp(v, c2[i], k)));
function prng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}

// The film is painted into a 1920x1080 master exactly as the original cut, then composed into the
// output format (?w=&h=): 16:9 shows the master as-is; taller formats follow the story's subject.
const params = new URLSearchParams(location.search);
const OUT = { w: Number(params.get("w") ?? 1920), h: Number(params.get("h") ?? 1080) };
const WIDE = OUT.w / OUT.h >= 1.7;
const canvas = document.getElementById("film");
canvas.width = OUT.w; canvas.height = OUT.h;
const out = canvas.getContext("2d");
const master = document.createElement("canvas");
master.width = WIDTH; master.height = HEIGHT;
const ctx = master.getContext("2d");
let ENV = { sub: [], mid: [], air: [] };
let ORB = null;

// ---------- pre-baked textures ----------
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

function bakeConcrete() {
  const c = makeCanvas(WIDTH, HEIGHT);
  const g = c.getContext("2d");
  const random = prng(11);
  g.fillStyle = "#15151b"; g.fillRect(0, 0, WIDTH, HEIGHT);
  const small = makeCanvas(240, 135);
  const s = small.getContext("2d");
  const image = s.createImageData(240, 135);
  for (let i = 0; i < image.data.length; i += 4) { const v = 14 + random() * 22; image.data[i] = v; image.data[i + 1] = v; image.data[i + 2] = v + 6; image.data[i + 3] = 255; }
  s.putImageData(image, 0, 0);
  g.filter = "blur(6px)"; g.drawImage(small, 0, 0, WIDTH, HEIGHT); g.filter = "none";
  // Formwork seams and tie holes: the room was poured, not rendered.
  g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 2;
  for (let x = 0; x <= WIDTH; x += 480) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 800); g.stroke(); }
  for (let y = 200; y < 800; y += 200) { g.beginPath(); g.moveTo(0, y); g.lineTo(WIDTH, y); g.stroke(); }
  g.fillStyle = "rgba(0,0,0,0.5)";
  for (let x = 120; x < WIDTH; x += 240) for (let y = 100; y < 800; y += 200) { g.beginPath(); g.arc(x, y, 5, 0, Math.PI * 2); g.fill(); }
  // Floor.
  const floor = g.createLinearGradient(0, 800, 0, HEIGHT);
  floor.addColorStop(0, "#101016"); floor.addColorStop(1, "#060609");
  g.fillStyle = floor; g.fillRect(0, 800, WIDTH, HEIGHT - 800);
  return c;
}

function bakeSky(dawn) {
  const c = makeCanvas(600, 460);
  const g = c.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, 460);
  if (dawn) { sky.addColorStop(0, "#6e7bb8"); sky.addColorStop(0.55, "#f2a47c"); sky.addColorStop(1, "#ffd6a0"); }
  else { sky.addColorStop(0, "#0b0d1f"); sky.addColorStop(0.7, "#161a36"); sky.addColorStop(1, "#262846"); }
  g.fillStyle = sky; g.fillRect(0, 0, 600, 460);
  const random = prng(dawn ? 5 : 3);
  // A distant skyline, with lit windows at night.
  g.fillStyle = dawn ? "#3d3048" : "#07070e";
  let x = 0;
  while (x < 600) { const w = 30 + random() * 60; const h = 60 + random() * 150; g.fillRect(x, 460 - h, w, h); x += w + 4; }
  if (!dawn) {
    for (let i = 0; i < 90; i += 1) { g.fillStyle = `rgba(255,214,150,${0.25 + random() * 0.5})`; g.fillRect(random() * 600, 330 + random() * 125, 3, 4); }
  }
  return c;
}

function bakeGrain(seed) {
  const c = makeCanvas(WIDTH / 2, HEIGHT / 2);
  const g = c.getContext("2d");
  const image = g.createImageData(c.width, c.height);
  const random = prng(seed);
  for (let i = 0; i < image.data.length; i += 4) { const v = random() * 255; image.data[i] = v; image.data[i + 1] = v; image.data[i + 2] = v; image.data[i + 3] = 255; }
  g.putImageData(image, 0, 0);
  return c;
}

const DUST = (() => { const r = prng(29); return Array.from({ length: 260 }, () => ({ x: r(), y: r(), size: 0.6 + r() * 1.8, phase: r() * 100, speed: 0.2 + r() * 0.6 })); })();

let CONCRETE, SKY_NIGHT, SKY_DAWN, GRAIN;

// ---------- the room's light plan ----------
function frameEnergy(frame) { return { sub: ENV.sub[frame] || 0, mid: ENV.mid[frame] || 0 }; }

function lights(t, sub) {
  const working = 1 - smooth(T.stop - 0.2, T.stop + 0.3, t);
  const waiting = smooth(T.stop, T.stop + 0.5, t) * (1 - smooth(T.climax - 0.1, T.climax + 0.2, t));
  const resumed = smooth(T.climax - 0.05, T.climax + 0.3, t);
  const dawn = smooth(T.dawn - 1, T.dawn + 5, t);
  return {
    monitor: 0.85 * working + 0.45 * waiting + (0.9 + 0.25 * sub) * resumed * (1 - dawn * 0.4),
    orb: resumed * (0.75 + 0.6 * sub) * (1 - dawn * 0.6) + dawn * 0.25,
    phone: window01(t, T.phoneBuzz, T.climax + 1.5, 0.3) * phoneBuzz(t),
    moon: 0.9 * (1 - dawn),
    dawn,
    pressure: smooth(T.pressure, T.crisis, t) * (1 - resumed),
  };
}

function phoneBuzz(t) {
  if (t >= T.crisis) return 1;
  const sinceBar = (t - T.phoneBuzz) % BAR;
  return t > T.phoneBuzz ? Math.exp(-sinceBar * 2.2) : 0;
}

// Wall clock: 02:40 at the top, 02:47 at the stop, 05:10 at the crisis, 07:02 at dawn.
const CLOCK_KEYS = [[0, 160], [T.stop, 167], [T.insertMonitorEnd, 172], [T.leaveDesk, 211], [T.stopsMultiply, 242], [at(14), 277], [T.pressure, 291], [T.crisis, 310], [T.climax, 311], [T.dawn, 400], [at(34), 422], [DURATION, 430]];
function clockMinutes(t) {
  for (let i = 1; i < CLOCK_KEYS.length; i += 1) {
    const [t0, m0] = CLOCK_KEYS[i - 1]; const [t1, m1] = CLOCK_KEYS[i];
    if (t < t1) { const k = (t - t0) / (t1 - t0); return Math.floor(lerp(m0, m1, t > T.climax && t < T.dawn ? k : Math.floor(k * 4) / 4)); }
  }
  return CLOCK_KEYS[CLOCK_KEYS.length - 1][1];
}
const clockText = (minutes) => `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;

// ---------- the screen (shared by the wide shot and the insert) ----------
const CODE_LINES = [
  ["› make reconnect resume by seq; keep tests green", "accent"],
  ["  reading session_transport.rs", "dim"],
  ["  editing state_mini_recovery.rs   +84 −31", "text"],
  ["  editing local_store/persister.rs +22 −9", "text"],
  ["  cargo test -p looper-client-core  ok", "ok"],
  ["  editing e2e_client_core.rs        +57 −4", "text"],
  ["  next: h3 reconnect e2e, then lint", "dim"],
];
const RESUME_LINES = [
  ["↻ looper · keep going until the checks pass", "accent"],
  ["  running h3 reconnect e2e          ok", "ok"],
  ["  pnpm test ✓   lint ✓   typecheck ✓", "ok"],
  ["  commit fix(client-core): resume by seq", "text"],
  ["  next session: claude-code · api", "dim"],
];
const SESSIONS = ["codex · looper", "claude-code · api", "cursor · web", "zed · docs"];

function drawScreen(g, w, h, t, sub) {
  const u = h / 320;
  g.fillStyle = "#0b0c18"; g.fillRect(0, 0, w, h);
  const tone = { text: "rgba(225,228,255,0.92)", dim: "rgba(160,164,200,0.8)", ok: rgba(COLOR.running, 0.95), accent: rgba(COLOR.accent, 1), stop: "#ffffff" };
  const lineHeight = 22 * u;
  const left = 18 * u;
  const sidebar = t > T.stopsMultiply ? 150 * u : 0;
  g.font = `${13.5 * u}px ${MONO}`;
  g.textBaseline = "top";
  const writeLine = (text, style, row, reveal = 1) => {
    g.fillStyle = tone[style];
    g.fillText(text.slice(0, Math.ceil(text.length * clamp(reveal))), left, 18 * u + row * lineHeight);
  };
  if (t < T.climax) {
    const shown = t < T.stop ? (t - 1.5) / (BEAT * 1.4) : CODE_LINES.length;
    CODE_LINES.forEach(([text, style], index) => { if (shown > index) writeLine(text, style, index, shown - index); });
    if (t >= T.stop) {
      writeLine("■ agent stopped. continue? [y/N]", "stop", CODE_LINES.length + 0.5);
      if (Math.floor(t / (BEAT)) % 2 === 0) { g.fillStyle = "#ffffff"; g.fillRect(left, 18 * u + (CODE_LINES.length + 1.6) * lineHeight, 9 * u, 15 * u); }
    }
  } else {
    writeLine("■ agent stopped. continue? [y/N]", "dim", 0);
    const shown = (t - T.climax - 0.4) / (BAR * 0.9);
    RESUME_LINES.forEach(([text, style], index) => { if (shown > index) writeLine(text, style, index + 1.2, (shown - index) * 1.5); });
    if (t > T.dawn) {
      g.fillStyle = rgba(COLOR.running, smooth(T.dawn, T.dawn + 1, t));
      g.font = `600 ${26 * u}px ${SANS}`;
      g.fillText("✓ all checks passed", left, 230 * u);
    }
  }
  if (sidebar) {
    const x = w - sidebar;
    g.fillStyle = "rgba(20,21,36,0.95)"; g.fillRect(x, 0, sidebar, h);
    g.font = `${10 * u}px ${MONO}`;
    g.fillStyle = "rgba(160,164,200,0.8)"; g.fillText("SESSIONS", x + 12 * u, 16 * u);
    SESSIONS.forEach((name, index) => {
      const appear = T.stopsMultiply + index * BAR * 1.1;
      if (t < appear) return;
      const y = 40 * u + index * 58 * u;
      const running = t > T.climax + index * BEAT;
      const done = t > T.dawn;
      g.fillStyle = "rgba(255,255,255,0.05)"; g.fillRect(x + 8 * u, y, sidebar - 16 * u, 50 * u);
      g.fillStyle = done ? rgba(COLOR.running, 1) : running ? rgba(COLOR.running, 0.7 + 0.3 * sub) : `rgba(255,255,255,${0.35 + 0.35 * (Math.floor(t / BEAT) % 2)})`;
      g.beginPath(); g.arc(x + 20 * u, y + 16 * u, 4 * u, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(225,228,255,0.9)"; g.fillText(name, x + 30 * u, y + 10 * u);
      g.fillStyle = "rgba(160,164,200,0.8)";
      const idle = Math.max(0, clockMinutes(t) - 167 - index * 20);
      g.fillText(done ? "done" : running ? "running" : `stopped · ${Math.floor(idle / 60)}h ${String(idle % 60).padStart(2, "0")}m`, x + 30 * u, y + 28 * u);
    });
  }
  // Scanline softness.
  g.fillStyle = "rgba(0,0,0,0.12)";
  for (let y = 0; y < h; y += 3 * u) g.fillRect(0, y, w, u);
}

// ---------- silhouettes ----------
function rimFill(g, path, rim, rimAlpha, rimWidth = 3) {
  g.fillStyle = COLOR.silhouette; g.fill(path);
  if (rimAlpha > 0.01) { g.strokeStyle = rgba(rim, rimAlpha); g.lineWidth = rimWidth; g.stroke(path); }
}

function seatedFigure(g, t, light, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  const typing = t < T.stop ? Math.sin(t * Math.PI * 2 / BEAT) * 2 : 0;
  const x = 640, seat = 900;
  const chair = new Path2D(); chair.roundRect(x - 120, seat - 150, 240, 250, 24);
  rimFill(g, chair, COLOR.screen, 0.12 * light);
  const body = new Path2D();
  body.moveTo(x - 150, seat + 80);
  body.bezierCurveTo(x - 150, seat - 110, x - 120, seat - 175 + typing, x - 60, seat - 190 + typing);
  body.lineTo(x - 26, seat - 205 + typing); body.lineTo(x - 22, seat - 228 + typing);
  body.arc(x, seat - 268 + typing, 44, Math.PI * 0.62, Math.PI * 2.38);
  body.lineTo(x + 26, seat - 205 + typing); body.lineTo(x + 60, seat - 190 + typing);
  body.bezierCurveTo(x + 120, seat - 175 + typing, x + 150, seat - 110, x + 150, seat + 80);
  body.closePath();
  rimFill(g, body, COLOR.screen, 0.55 * light, 3.5);
  g.restore();
}

function couch(g, rim, rimAlpha) {
  const back = new Path2D(); back.roundRect(1150, 700, 600, 120, 28);
  const seat = new Path2D(); seat.roundRect(1130, 790, 640, 90, 22);
  const armLeft = new Path2D(); armLeft.roundRect(1110, 730, 70, 170, 26);
  const armRight = new Path2D(); armRight.roundRect(1720, 730, 70, 170, 26);
  [back, seat, armLeft, armRight].forEach((p) => rimFill(g, p, rim, rimAlpha, 2));
  g.fillStyle = "#040406"; g.fillRect(1150, 880, 16, 40); g.fillRect(1734, 880, 16, 40);
}

function lyingFigure(g, variant, rim, rimAlpha, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  const body = new Path2D();
  const headX = 1660, headY = 752 + variant * 6;
  body.moveTo(1190, 800);
  body.bezierCurveTo(1230, 740 - variant * 20, 1300, 730, 1350, 770);   // knees
  body.bezierCurveTo(1420, 760, 1520, 740, 1600, 770);                  // torso under a blanket
  body.lineTo(1640, 790);
  body.lineTo(1190, 800);
  body.closePath();
  rimFill(g, body, rim, rimAlpha, 2.5);
  const head = new Path2D(); head.arc(headX, headY, 32, 0, Math.PI * 2);
  rimFill(g, head, rim, rimAlpha, 2.5);
  g.restore();
}

function phoneArm(g, t, glow, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  const arm = new Path2D();
  arm.moveTo(1600, 772); arm.quadraticCurveTo(1590, 690, 1625, 660); arm.lineTo(1640, 668); arm.quadraticCurveTo(1612, 700, 1622, 772); arm.closePath();
  rimFill(g, arm, [210, 214, 255], 0.5 * glow, 2);
  // The phone faces the sleeper; its light spills onto the face and ceiling.
  const light = g.createRadialGradient(1645, 700, 4, 1645, 700, 260);
  light.addColorStop(0, rgba([210, 214, 255], 0.55 * glow)); light.addColorStop(1, "rgba(0,0,0,0)");
  g.globalCompositeOperation = "screen"; g.fillStyle = light; g.fillRect(1380, 440, 540, 520);
  g.globalCompositeOperation = "source-over";
  g.fillStyle = "#08080c"; g.save(); g.translate(1632, 648); g.rotate(0.5); g.fillRect(-16, -26, 32, 52); g.restore();
  g.restore();
}

function sittingUpFigure(g, rim, rimAlpha, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;
  const body = new Path2D();
  body.moveTo(1480, 800); body.lineTo(1500, 660); body.bezierCurveTo(1505, 620, 1540, 610, 1560, 615);
  body.lineTo(1575, 598); body.arc(1560, 560, 36, Math.PI * 0.35, Math.PI * 2.1);
  body.lineTo(1600, 625); body.bezierCurveTo(1620, 660, 1625, 720, 1630, 800); body.closePath();
  rimFill(g, body, rim, rimAlpha, 3);
  const legs = new Path2D(); legs.roundRect(1330, 790, 300, 40, 18);
  rimFill(g, legs, rim, rimAlpha * 0.6, 2);
  g.restore();
}

// ---------- the wide shot ----------
function camera(t, sub) {
  const pushes = [
    [0, T.stop, 1.0, 1.1, 640, 560],
    [T.insertMonitorEnd, T.pressure, 1.0, 1.08, 1150, 640],
    [T.pressure, T.crisis, 1.03, 1.2, 1500, 720],
    [T.climax, T.dawn, 1.14, 1.0, 960, 600],
    [T.dawn, T.endCard, 1.0, 1.06, 1300, 640],
  ];
  const shot = pushes.find(([start, end]) => t >= start && t < end) || pushes[0];
  const [start, end, s0, s1, fx, fy] = shot;
  const k = smooth(start, end, t);
  const shake = t > T.climax && t < T.dawn ? sub * 3 : 0;
  return { scale: lerp(s0, s1, k), fx, fy, dx: Math.sin(t * 37) * shake, dy: Math.cos(t * 29) * shake };
}

function drawRoom(g, t, sub) {
  const L = lights(t, sub);
  const cam = camera(t, sub);
  g.save();
  g.translate(WIDTH / 2 + cam.dx, HEIGHT / 2 + cam.dy);
  g.scale(cam.scale, cam.scale);
  g.translate(-lerp(WIDTH / 2, cam.fx, 0.6), -lerp(HEIGHT / 2, cam.fy, 0.6));

  g.drawImage(CONCRETE, 0, 0);

  // Window: night sky dissolving into dawn.
  const win = { x: 1080, y: 110, w: 600, h: 460 };
  g.drawImage(SKY_NIGHT, win.x, win.y);
  if (L.dawn > 0) { g.globalAlpha = L.dawn; g.drawImage(SKY_DAWN, win.x, win.y); g.globalAlpha = 1; }
  g.fillStyle = "#050507";
  for (let i = 0; i <= 4; i += 1) g.fillRect(win.x + i * (win.w / 4) - 6, win.y, 12, win.h);
  for (let j = 0; j <= 4; j += 1) g.fillRect(win.x, win.y + j * (win.h / 4) - 6, win.w, 12);

  // The light shaft walks across the room as the night passes.
  const drift = t / DURATION;
  const shaftColor = mix(COLOR.moon, COLOR.dawn, L.dawn);
  const shaftAlpha = 0.07 * L.moon + 0.2 * L.dawn;
  g.save();
  g.globalCompositeOperation = "screen";
  const shaft = new Path2D();
  const floorLeft = lerp(760, 380, drift), floorRight = lerp(1360, 980, drift);
  shaft.moveTo(win.x, win.y); shaft.lineTo(win.x + win.w, win.y); shaft.lineTo(floorRight, 1000); shaft.lineTo(floorLeft, 1000); shaft.closePath();
  const shaftGradient = g.createLinearGradient(win.x, win.y, floorLeft, 1000);
  shaftGradient.addColorStop(0, rgba(shaftColor, shaftAlpha * 1.6)); shaftGradient.addColorStop(1, rgba(shaftColor, shaftAlpha * 0.4));
  g.fillStyle = shaftGradient; g.fill(shaft);
  // Dust hangs in the shaft; the kick shakes it.
  g.clip(shaft);
  DUST.forEach((d) => {
    const x = 380 + ((d.x * 1300 + Math.sin(t * d.speed + d.phase) * 30) % 1300);
    const y = 110 + ((d.y * 890 + t * 6 * d.speed) % 890) + sub * Math.sin(d.phase * 7) * 5;
    g.fillStyle = rgba(shaftColor, 0.35 + 0.4 * sub); g.fillRect(x, y, d.size, d.size);
  });
  g.restore();

  // LED wall clock above the desk.
  g.font = `500 64px ${MONO}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = rgba(COLOR.accent, 0.8); g.shadowBlur = 24;
  g.fillStyle = rgba([226, 220, 255], 0.9);
  g.fillText(clockText(clockMinutes(t)), 640, 318);
  g.shadowBlur = 0; g.textAlign = "left";

  // The loop, projected: the orb throws a turning ring of light onto the wall once it wakes.
  if (L.orb > 0.05 && t > T.climax) {
    g.save(); g.globalCompositeOperation = "screen";
    g.translate(900, 470); g.scale(1, 0.62);
    g.rotate((t - T.climax) * 0.6);
    g.setLineDash([60, 26]); g.lineWidth = 10 + 8 * sub;
    g.strokeStyle = rgba(COLOR.accent, 0.22 * L.orb); g.shadowColor = rgba(COLOR.accent, 1); g.shadowBlur = 40;
    g.beginPath(); g.arc(0, 0, 330, 0, Math.PI * 2); g.stroke();
    g.restore();
  }

  // Monitor light on the wall.
  const screenColor = t > T.climax ? mix(COLOR.screen, COLOR.accent, 0.35) : COLOR.screen;
  g.save(); g.globalCompositeOperation = "screen";
  const wash = g.createRadialGradient(630, 560, 40, 630, 560, 760);
  wash.addColorStop(0, rgba(screenColor, 0.3 * L.monitor)); wash.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = wash; g.fillRect(0, 0, WIDTH, HEIGHT);
  g.restore();

  // Desk, monitor, orb.
  g.fillStyle = "#0a0a0f"; g.fillRect(360, 700, 3, 3);
  const screen = { x: 360, y: 380, w: 540, h: 320 };
  g.fillStyle = "#050507"; g.fillRect(screen.x - 14, screen.y - 14, screen.w + 28, screen.h + 28);
  g.save(); g.translate(screen.x, screen.y);
  g.globalAlpha = clamp(0.25 + L.monitor);
  drawScreen(g, screen.w, screen.h, t, sub);
  g.restore();
  g.fillStyle = "#050507"; g.fillRect(605, 714, 50, 56);
  const desk = new Path2D(); desk.rect(250, 768, 760, 20);
  rimFill(g, desk, screenColor, 0.3 * L.monitor, 2);
  g.fillStyle = "#050507"; g.fillRect(270, 788, 16, 190); g.fillRect(975, 788, 16, 190);

  // Orb: dormant on the desk from the first frame; it wakes at the climax.
  const orb = { x: 880, y: 728, r: 40 };
  if (L.orb > 0) {
    g.save(); g.globalCompositeOperation = "screen";
    const glow = g.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, 420 + 160 * sub);
    glow.addColorStop(0, rgba(COLOR.accent, 0.9 * L.orb)); glow.addColorStop(0.25, rgba(COLOR.accent, 0.25 * L.orb)); glow.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = glow; g.fillRect(0, 0, WIDTH, HEIGHT);
    g.restore();
  }
  g.save();
  g.filter = `brightness(${0.28 + 0.9 * L.orb}) saturate(${0.3 + 0.7 * L.orb})`;
  g.drawImage(ORB, orb.x - orb.r, orb.y - orb.r, orb.r * 2, orb.r * 2);
  g.restore();

  // Couch and the sleeper.
  const couchRim = mix(COLOR.moon, COLOR.dawn, L.dawn);
  couch(g, couchRim, 0.1 + 0.2 * L.dawn + 0.12 * L.orb);
  const onCouch = smooth(T.leaveDesk - 0.4, T.leaveDesk + 0.4, t);
  const restless = window01(t, T.pressure, T.crisis, 0.4);
  const tossPhase = Math.floor((t - T.pressure) / BAR) % 2;
  const withPhone = smooth(T.crisis - 0.6, T.crisis, t) * (1 - smooth(T.climax + 1.2, T.climax + 2, t));
  const sittingUp = smooth(T.wake - 0.5, T.wake + 0.5, t);
  const lyingAlpha = onCouch * (1 - sittingUp);
  lyingFigure(g, restless > 0.5 ? tossPhase : 0, couchRim, 0.2 + 0.3 * L.dawn + 0.25 * L.orb, lyingAlpha);
  phoneArm(g, t, L.phone, withPhone * lyingAlpha);
  if (L.phone > 0.01 && withPhone < 0.5) {
    g.save(); g.globalCompositeOperation = "screen";
    const buzz = g.createRadialGradient(1560, 770, 2, 1560, 770, 180);
    buzz.addColorStop(0, rgba([210, 214, 255], 0.5 * L.phone)); buzz.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = buzz; g.fillRect(1360, 590, 400, 360);
    g.restore();
  }
  sittingUpFigure(g, couchRim, 0.4 + 0.3 * L.dawn, sittingUp);

  seatedFigure(g, t, L.monitor, 1 - onCouch);

  // Dawn floods the room at the end.
  if (L.dawn > 0) {
    g.save(); g.globalCompositeOperation = "soft-light";
    const warm = g.createLinearGradient(WIDTH, 0, 0, HEIGHT);
    warm.addColorStop(0, rgba(COLOR.dawn, 0.8 * L.dawn)); warm.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = warm; g.fillRect(0, 0, WIDTH, HEIGHT);
    g.restore();
  }
  g.restore();

  // Pressure: the frame darkens at the edges as the night runs out.
  const edge = 0.55 + 0.3 * L.pressure;
  const vignette = g.createRadialGradient(WIDTH / 2, HEIGHT * 0.55, HEIGHT * 0.3, WIDTH / 2, HEIGHT * 0.55, HEIGHT * 1.05);
  vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, `rgba(0,0,0,${edge})`);
  g.fillStyle = vignette; g.fillRect(0, 0, WIDTH, HEIGHT);
}

// ---------- inserts ----------
function drawMonitorInsert(g, t, sub) {
  g.fillStyle = "#020203"; g.fillRect(0, 0, WIDTH, HEIGHT);
  const push = smooth(T.stop, T.insertMonitorEnd, t);
  const w = lerp(1500, 1600, push), h = w * 320 / 540;
  g.save(); g.translate((WIDTH - w) / 2, (HEIGHT - h) / 2 + 20);
  drawScreen(g, w, h, t, sub);
  g.restore();
  const glow = g.createRadialGradient(WIDTH / 2, HEIGHT / 2, 200, WIDTH / 2, HEIGHT / 2, 1100);
  glow.addColorStop(0, "rgba(0,0,0,0)"); glow.addColorStop(1, "rgba(0,0,0,0.7)");
  g.fillStyle = glow; g.fillRect(0, 0, WIDTH, HEIGHT);
}

const REPLY = "keep going until the checks pass";
function drawPhoneInsert(g, t) {
  g.fillStyle = "#010102"; g.fillRect(0, 0, WIDTH, HEIGHT);
  const phone = { x: 760, y: 150, w: 400, h: 820 };
  const face = g.createRadialGradient(960, 560, 50, 960, 560, 900);
  face.addColorStop(0, "rgba(120,126,190,0.22)"); face.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = face; g.fillRect(0, 0, WIDTH, HEIGHT);
  // Hand.
  g.fillStyle = COLOR.silhouette;
  g.beginPath(); g.ellipse(960, 1010, 330, 190, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#0a0a10"; g.beginPath(); g.roundRect(phone.x - 12, phone.y - 12, phone.w + 24, phone.h + 24, 64); g.fill();
  const screen = g.createLinearGradient(0, phone.y, 0, phone.y + phone.h);
  screen.addColorStop(0, "#1c1934"); screen.addColorStop(1, "#0b0a16");
  g.fillStyle = screen; g.beginPath(); g.roundRect(phone.x, phone.y, phone.w, phone.h, 54); g.fill();
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillStyle = "#f2effc"; g.font = `200 118px ${SANS}`; g.fillText("05:10", 960, phone.y + 190);
  g.font = `500 22px ${SANS}`; g.fillStyle = "rgba(242,239,252,0.7)"; g.fillText("Alarm 07:00", 960, phone.y + 232);
  g.textAlign = "left";
  // Looper's notification.
  const card = { x: phone.x + 22, y: phone.y + 280, w: phone.w - 44, h: 150 };
  g.fillStyle = "rgba(70,66,100,0.8)"; g.beginPath(); g.roundRect(card.x, card.y, card.w, card.h, 26); g.fill();
  g.drawImage(ORB, card.x + 18, card.y + 18, 36, 36);
  g.font = `600 19px ${SANS}`; g.fillStyle = "#e9e6f6"; g.fillText("LOOPER", card.x + 66, card.y + 42);
  g.font = `400 17px ${SANS}`; g.fillStyle = "rgba(233,230,246,0.65)"; g.fillText("now", card.x + card.w - 50, card.y + 42);
  g.font = `600 22px ${SANS}`; g.fillStyle = "#ffffff"; g.fillText("4 sessions stopped", card.x + 20, card.y + 88);
  g.font = `400 20px ${SANS}`; g.fillStyle = "rgba(255,255,255,0.85)"; g.fillText("Codex is asking: continue?", card.x + 20, card.y + 120);
  // The choice, typed one tap at a time.
  const typed = Math.round(REPLY.length * smooth(T.reply, T.send - 0.1, t));
  const field = { x: phone.x + 22, y: phone.y + 470, w: phone.w - 44, h: 64 };
  g.fillStyle = "rgba(255,255,255,0.1)"; g.beginPath(); g.roundRect(field.x, field.y, field.w, field.h, 32); g.fill();
  g.font = `400 20px ${SANS}`; g.fillStyle = typed ? "#ffffff" : "rgba(255,255,255,0.45)";
  g.fillText(typed ? REPLY.slice(0, typed) : "Reply…", field.x + 24, field.y + 40);
  const sent = smooth(T.send, T.send + 0.15, t);
  g.fillStyle = rgba(COLOR.accent, 0.4 + 0.6 * sent);
  g.beginPath(); g.arc(field.x + field.w - 30, field.y + 32, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#140f26"; g.font = `700 22px ${SANS}`; g.fillText("↑", field.x + field.w - 37, field.y + 40);
  // Sent: the phone flares, and the room answers.
  if (sent > 0) { g.fillStyle = rgba([235, 228, 255], 0.9 * sent); g.fillRect(0, 0, WIDTH, HEIGHT); }
}

// ---------- end card ----------
function drawEndCard(g, t, sub) {
  const k = t - T.endCard;
  g.fillStyle = "#050508"; g.fillRect(0, 0, WIDTH, HEIGHT);
  const glow = g.createRadialGradient(960, 400, 20, 960, 400, 520);
  glow.addColorStop(0, rgba(COLOR.accent, 0.35 * smooth(0, 1.2, k))); glow.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = glow; g.fillRect(0, 0, WIDTH, HEIGHT);
  const size = lerp(150, 220, smooth(0, 1.4, k));
  g.globalAlpha = smooth(0, 0.8, k);
  g.save(); g.translate(960, 400); g.rotate(k * 0.08); g.drawImage(ORB, -size / 2, -size / 2, size, size); g.restore();
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.globalAlpha = smooth(0.6, 1.4, k);
  g.fillStyle = "#f1eff8"; g.font = `700 150px ${SANS}`;
  g.fillText("LOOPER", 960, 660);
  g.globalAlpha = smooth(1.6, 2.4, k);
  g.font = `400 38px ${SANS}`; g.fillStyle = rgba(COLOR.accent, 1);
  g.fillText("Keeps your agents moving until the work is actually done.", 960, 740);
  g.globalAlpha = smooth(2.8, 3.6, k);
  g.font = `500 22px ${MONO}`; g.fillStyle = "rgba(200,198,215,0.8)";
  g.fillText("CODEX  ·  CLAUDE CODE  ·  CURSOR  ·  ZED  ·  DEVIN  ·  GROK BUILD", 960, 812);
  g.globalAlpha = smooth(3.6, 4.4, k);
  g.font = `600 30px ${SANS}`; g.fillStyle = "#f1eff8"; g.fillText("looper.fyi", 960, 880);
  g.globalAlpha = 1; g.textAlign = "left";
}

// ---------- frame ----------
function paintFrame(frame) {
  const t = frame / FPS;
  const { sub } = frameEnergy(frame);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  if (t >= T.endCard) drawEndCard(ctx, t, sub);
  else if (t >= T.crisis && t < T.climax) drawPhoneInsert(ctx, t);
  else if (t >= T.stop && t < T.insertMonitorEnd) drawMonitorInsert(ctx, t, sub);
  else drawRoom(ctx, t, sub);
  overlays(ctx, t, WIDTH, HEIGHT);
  compose(frame, t, sub);
}

// Fades, the tape-stop dim, and the flash on the drop.
function overlays(g, t, w, h) {
  const black = (1 - smooth(0, 1.6, t)) + window01(t, T.endCard - 0.4, T.endCard + 0.2, 0.5) * 0.9;
  if (black > 0) { g.fillStyle = `rgba(0,0,0,${clamp(black)})`; g.fillRect(0, 0, w, h); }
  if (t > T.stop - BEAT && t < T.stop) { const k = (t - (T.stop - BEAT)) / BEAT; g.fillStyle = `rgba(0,0,0,${0.6 * k * k})`; g.fillRect(0, 0, w, h); }
  if (t >= T.climax && t < T.climax + 0.5) { g.fillStyle = rgba([235, 228, 255], 0.9 * (1 - (t - T.climax) / 0.5)); g.fillRect(0, 0, w, h); }
}

// What the viewer should be looking at, in room coordinates: the desk, the stopped sessions on the
// monitor, the sleeper on the couch, the orb, the dawn. Taller formats pan to follow it.
const SUBJECT = [[0, 640], [at(10) - 0.3, 640], [at(10) + 0.5, 1500], [at(12) - 0.3, 1500], [at(12) + 0.4, 790], [at(16) - 0.3, 790], [at(16) + 0.4, 1500],
  [at(24) - 0.02, 1500], [at(24), 900], [at(30), 900], [at(31), 1300], [at(32), 1300], [at(33), 1450], [at(34), 1450], [at(34) + 0.6, 1560], [DURATION, 1560]];
function subjectX(t) {
  for (let i = 1; i < SUBJECT.length; i += 1) {
    const [t0, x0] = SUBJECT[i - 1], [t1, x1] = SUBJECT[i];
    if (t < t1) return lerp(x0, x1, smooth(t0, t1, t));
  }
  return SUBJECT[SUBJECT.length - 1][1];
}
// Where the subject lands on the master, through the room's own camera move.
function subjectOnMaster(t, sub) {
  if (t >= T.crisis && t < T.climax) return WIDTH / 2; // the phone insert is centred
  const cam = camera(t, sub);
  return WIDTH / 2 + cam.dx + (subjectX(t) - lerp(WIDTH / 2, cam.fx, 0.6)) * cam.scale;
}

function compose(frame, t, sub) {
  out.setTransform(1, 0, 0, 1, 0, 0);
  out.globalAlpha = 1; out.globalCompositeOperation = "source-over"; out.filter = "none";
  if (WIDE) {
    out.drawImage(master, 0, 0, OUT.w, OUT.h);
  } else if (t >= T.endCard) {
    drawEndCardTall(out, t, sub); overlays(out, t, OUT.w, OUT.h);
  } else if (t >= T.stop && t < T.insertMonitorEnd) {
    drawMonitorInsertTall(out, t, sub); overlays(out, t, OUT.w, OUT.h);
  } else {
    const scale = OUT.h / HEIGHT;
    const cropWidth = OUT.w / scale;
    const left = clamp(subjectOnMaster(t, sub) - cropWidth / 2, 0, WIDTH - cropWidth);
    out.drawImage(master, left, 0, cropWidth, HEIGHT, 0, 0, OUT.w, OUT.h);
  }
  out.globalCompositeOperation = "overlay"; out.globalAlpha = 0.09;
  out.drawImage(GRAIN[frame % GRAIN.length], 0, 0, OUT.w, OUT.h);
  out.globalCompositeOperation = "source-over"; out.globalAlpha = 1;
  if (WIDE) { const bar = Math.round(LETTERBOX * OUT.h / HEIGHT); out.fillStyle = "#000"; out.fillRect(0, 0, OUT.w, bar); out.fillRect(0, OUT.h - bar, OUT.w, bar); }
}

// The monitor insert, laid out natively for a tall frame so no line of the terminal is cropped.
function drawMonitorInsertTall(g, t, sub) {
  g.fillStyle = "#020203"; g.fillRect(0, 0, OUT.w, OUT.h);
  const push = smooth(T.stop, T.insertMonitorEnd, t);
  const w = OUT.w * lerp(0.94, 0.98, push), h = w * 320 / 540;
  g.save(); g.translate((OUT.w - w) / 2, (OUT.h - h) / 2); drawScreen(g, w, h, t, sub); g.restore();
  const glow = g.createRadialGradient(OUT.w / 2, OUT.h / 2, OUT.w * 0.2, OUT.w / 2, OUT.h / 2, OUT.h * 0.7);
  glow.addColorStop(0, "rgba(0,0,0,0)"); glow.addColorStop(1, "rgba(0,0,0,0.7)");
  g.fillStyle = glow; g.fillRect(0, 0, OUT.w, OUT.h);
}

// The end card, laid out natively for a tall frame.
function drawEndCardTall(g, t, sub) {
  const k = t - T.endCard;
  const u = OUT.w / 1080;
  const cx = OUT.w / 2, orbY = OUT.h * (OUT.h > OUT.w * 1.4 ? 0.34 : 0.3);
  g.fillStyle = "#050508"; g.fillRect(0, 0, OUT.w, OUT.h);
  const glow = g.createRadialGradient(cx, orbY, 20, cx, orbY, 520 * u);
  glow.addColorStop(0, rgba(COLOR.accent, 0.35 * smooth(0, 1.2, k))); glow.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = glow; g.fillRect(0, 0, OUT.w, OUT.h);
  const size = lerp(150, 230, smooth(0, 1.4, k)) * u;
  g.globalAlpha = smooth(0, 0.8, k);
  g.save(); g.translate(cx, orbY); g.rotate(k * 0.08); g.drawImage(ORB, -size / 2, -size / 2, size, size); g.restore();
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.globalAlpha = smooth(0.6, 1.4, k);
  g.fillStyle = "#f1eff8"; g.font = `700 ${150 * u}px ${SANS}`; g.fillText("LOOPER", cx, orbY + 280 * u);
  g.globalAlpha = smooth(1.6, 2.4, k);
  g.font = `400 ${46 * u}px ${SANS}`; g.fillStyle = rgba(COLOR.accent, 1);
  g.fillText("Keeps your agents moving", cx, orbY + 370 * u);
  g.fillText("until the work is actually done.", cx, orbY + 430 * u);
  g.globalAlpha = smooth(2.8, 3.6, k);
  g.font = `500 ${26 * u}px ${MONO}`; g.fillStyle = "rgba(200,198,215,0.8)";
  g.fillText("CODEX  ·  CLAUDE CODE  ·  CURSOR", cx, orbY + 520 * u);
  g.fillText("ZED  ·  DEVIN  ·  GROK BUILD", cx, orbY + 560 * u);
  g.globalAlpha = smooth(3.6, 4.4, k);
  g.font = `600 ${36 * u}px ${SANS}`; g.fillStyle = "#f1eff8"; g.fillText("looper.fyi", cx, orbY + 650 * u);
  g.globalAlpha = 1; g.textAlign = "left";
}

window.setup = async (envelope, orbDataUrl) => {
  ENV = envelope;
  ORB = new Image(); ORB.src = orbDataUrl; await ORB.decode();
  await document.fonts.ready;
  CONCRETE = bakeConcrete(); SKY_NIGHT = bakeSky(false); SKY_DAWN = bakeSky(true);
  GRAIN = [1, 2, 3, 4].map(bakeGrain);
  return Math.round(DURATION * FPS);
};
window.renderFrame = (frame, quality = 0.93) => { paintFrame(frame); return canvas.toDataURL("image/jpeg", quality).split(",")[1]; };
</script>
