syntax = "proto3";

package looper.v1;

service LooperRealtime {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Session(stream ClientFrame) returns (stream ServerFrame);
  rpc SetSessionMode(SetSessionModeRequest) returns (SetSessionModeResponse);
  rpc SendSessionPrompt(SendSessionPromptRequest) returns (SendSessionPromptResponse);
  rpc SubmitNotificationReply(SubmitNotificationReplyRequest) returns (SubmitNotificationReplyResponse);
  rpc SubscribeMobileEvents(SubscribeEventsRequest) returns (stream MobileEvent);
  rpc SubscribeDesktopEvents(SubscribeEventsRequest) returns (stream MobileEvent);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string service = 2;
  string server_time = 3;
}

message ClientFrame {
  oneof frame {
    Command command = 1;
    Resume resume = 2;
  }
}

message ServerFrame {
  oneof frame {
    CommandAck ack = 1;
    StateMiniDelta state_delta = 2;
    TextChunk text_chunk = 3;
    MobileEvent event = 4;
    Heartbeat heartbeat = 5;
  }
}

message Command {
  oneof command {
    SetSessionModeRequest set_session_mode = 1;
    SendSessionPromptRequest send_session_prompt = 2;
    SubmitNotificationReplyRequest submit_notification_reply = 3;
  }
}

message Resume {
  int64 after_seq = 1;
}

message SetSessionModeRequest {
  string thread_id = 1;
  string preset = 2;
  string client_mutation_id = 3;
}

message SetSessionModeResponse {
  bool accepted = 1;
  string thread_id = 2;
  string preset = 3;
  string server_time = 4;
  string client_mutation_id = 5;
  int64 ack_seq = 6;
  string entity_id = 7;
  string revision = 8;
  bool idempotent_replay = 9;
  CommandAck ack = 10;
}

message SendSessionPromptRequest {
  string thread_id = 1;
  string prompt = 2;
  string assistant_surface = 3;
  string client_mutation_id = 4;
}

message SendSessionPromptResponse {
  bool accepted = 1;
  string dispatch_kind = 2;
  string prompt_id = 3;
  string server_time = 4;
  string client_mutation_id = 5;
  int64 ack_seq = 6;
  string entity_id = 7;
  string revision = 8;
  bool idempotent_replay = 9;
  CommandAck ack = 10;
}

message SubmitNotificationReplyRequest {
  string notification_id = 1;
  string thread_id = 2;
  string prompt = 3;
  string assistant_surface = 4;
  string client_mutation_id = 5;
}

message SubmitNotificationReplyResponse {
  bool accepted = 1;
  string dispatch_kind = 2;
  string prompt_id = 3;
  string server_time = 4;
  string client_mutation_id = 5;
  int64 ack_seq = 6;
  string entity_id = 7;
  string revision = 8;
  bool idempotent_replay = 9;
  CommandAck ack = 10;
  string notification_id = 11;
}

message CommandAck {
  bool accepted = 1;
  string client_mutation_id = 2;
  int64 ack_seq = 3;
  string entity_id = 4;
  string revision = 5;
  string server_time = 6;
  bool idempotent_replay = 7;
  string error_code = 8;
  string reject_reason = 9;
}

message StateMiniDelta {
  int64 seq = 1;
  string entity_id = 2;
  string kind = 3;
  string revision = 4;
  string server_time = 5;
  string payload_json = 6;
}

message TextChunk {
  int64 seq = 1;
  string thread_id = 2;
  string message_id = 3;
  string content = 4;
  bool is_final = 5;
  string server_time = 6;
}

message Heartbeat {
  string server_time = 1;
  int64 latest_seq = 2;
}

message SubscribeEventsRequest {}

message MobileEvent {
  int32 kind = 1;
  string event_name = 2;
  string thread_id = 3;
  string prompt_id = 4;
  string detail = 5;
  string server_time = 6;
  string revision = 7;
}
