syntax = "proto3";

package looper.v1;

service LooperRealtime {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Session(stream ClientFrame) returns (stream ServerFrame);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string service = 2;
  string server_time = 3;
}

message ClientFrame {
  oneof frame {
    Command command = 1;
    Resume resume = 2;
  }
}

message ServerFrame {
  oneof frame {
    CommandAck ack = 1;
    StateMiniDelta state_delta = 2;
    TextChunk text_chunk = 3;
    MobileEvent event = 4;
    Heartbeat heartbeat = 5;
  }
}

message Command {
  oneof command {
    SetSessionModeRequest set_session_mode = 1;
    SendSessionPromptRequest send_session_prompt = 2;
    SubmitNotificationReplyRequest submit_notification_reply = 3;
    SetSiriCurrentSessionRequest set_siri_current_session = 5;
    SetSiriDefaultSessionRequest set_siri_default_session = 6;
    SaveDefaultPromptRequest save_default_prompt = 7;
    SetSessionArchivedRequest set_session_archived = 8;
    DeleteSessionRequest delete_session = 9;
    MuteSessionRequest mute_session = 10;
    SetScopeRequest set_scope = 11;
    SetGlobalPresetRequest set_global_preset = 12;
    SetGlobalNotificationRequest set_global_notification = 13;
    SetDefaultNotificationTargetsRequest set_default_notification_targets = 14;
    SetGlobalCompletionCheckRequest set_global_completion_check = 15;
    UpsertNotificationRouteRequest upsert_notification_route = 16;
    DeleteNotificationRouteRequest delete_notification_route = 17;
    UpsertCompletionCheckRequest upsert_completion_check = 18;
    DeleteCompletionCheckRequest delete_completion_check = 19;
    SetSessionNotificationsRequest set_session_notifications = 20;
    SetSessionCompletionCheckRequest set_session_completion_check = 21;
  }
}

message Resume {
  int64 after_seq = 1;
}

message SetSessionModeRequest {
  string thread_id = 1;
  string preset = 2;
  string client_mutation_id = 3;
}

message SendSessionPromptRequest {
  string thread_id = 1;
  string prompt = 2;
  string assistant_surface = 3;
  string client_mutation_id = 4;
  string prompt_intent = 5;
}

message SubmitNotificationReplyRequest {
  string notification_id = 1;
  string thread_id = 2;
  string prompt = 3;
  string assistant_surface = 4;
  string client_mutation_id = 5;
}

message SetSiriCurrentSessionRequest {
  string thread_id = 1;
  string assistant_surface = 2;
  string client_mutation_id = 3;
}

message SetSiriDefaultSessionRequest {
  string thread_id = 1;
  string assistant_surface = 2;
  string client_mutation_id = 3;
}

message SaveDefaultPromptRequest {
  string prompt = 1;
  string client_mutation_id = 2;
}

message SetSessionArchivedRequest {
  string thread_id = 1;
  bool archived = 2;
  string client_mutation_id = 3;
}

message DeleteSessionRequest {
  string thread_id = 1;
  string client_mutation_id = 2;
}

message MuteSessionRequest {
  string thread_id = 1;
  string client_mutation_id = 2;
}

message SetScopeRequest {
  string scope = 1;
  string client_mutation_id = 2;
}

message SetGlobalPresetRequest {
  string preset = 1;
  string client_mutation_id = 2;
}

message SetGlobalNotificationRequest {
  string notification_id = 1;
  string client_mutation_id = 2;
}

message SetDefaultNotificationTargetsRequest {
  repeated string notification_target_ids = 1;
  string client_mutation_id = 2;
}

message SetGlobalCompletionCheckRequest {
  string completion_check_id = 1;
  bool wait_for_reply_after_completion = 2;
  string client_mutation_id = 3;
}

message UpsertNotificationRouteRequest {
  string notification_id = 1;
  string label = 2;
  string channel = 3;
  string webhook_url = 4;
  string chat_id = 5;
  string bot_token = 6;
  string chat_username = 7;
  string chat_display_name = 8;
  string client_mutation_id = 9;
}

message DeleteNotificationRouteRequest {
  string notification_id = 1;
  string client_mutation_id = 2;
}

message UpsertCompletionCheckRequest {
  string completion_check_id = 1;
  string label = 2;
  repeated string commands = 3;
  string client_mutation_id = 4;
}

message DeleteCompletionCheckRequest {
  string completion_check_id = 1;
  string client_mutation_id = 2;
}

message SetSessionNotificationsRequest {
  string thread_id = 1;
  repeated string notification_ids = 2;
  string client_mutation_id = 3;
}

message SetSessionCompletionCheckRequest {
  string thread_id = 1;
  string completion_check_id = 2;
  bool wait_for_reply_after_completion = 3;
  string client_mutation_id = 4;
}

message CommandAck {
  bool accepted = 1;
  string client_mutation_id = 2;
  int64 ack_seq = 3;
  string entity_id = 4;
  string revision = 5;
  string server_time = 6;
  bool idempotent_replay = 7;
  string error_code = 8;
  string reject_reason = 9;
  string account_id = 10;
  string node_id = 11;
  string current_state = 12;
}

message StateMiniDelta {
  int64 seq = 1;
  string entity_id = 2;
  string kind = 3;
  string revision = 4;
  string server_time = 5;
  string payload_json = 6;
}

// Ephemeral, bounded live text hint on the Session control stream.
// Full transcript/log/output content belongs to the data plane.
message TextChunk {
  int64 seq = 1;
  string thread_id = 2;
  string message_id = 3;
  string content = 4;
  bool is_final = 5;
  string server_time = 6;
}

message Heartbeat {
  string server_time = 1;
  int64 latest_seq = 2;
}

message MobileEvent {
  int32 kind = 1;
  string event_name = 2;
  string thread_id = 3;
  string prompt_id = 4;
  string detail = 5;
  string server_time = 6;
  string revision = 7;
}
