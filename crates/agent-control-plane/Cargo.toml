[package]
name = "agent-control-plane"
version = "1.1.5"
edition = "2024"
autobins = false

[[bin]]
name = "agent-control-plane"
path = "src/bin/agent-control-plane.rs"

[[bin]]
name = "looper"
path = "src/bin/looper.rs"

[[bin]]
name = "looper-cli"
path = "src/bin/looper-cli.rs"

[[bin]]
name = "looper-server"
path = "src/bin/looper-server.rs"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = "0.7.9"
base64 = "0.22.1"
crossterm = "0.28.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
orb-code = { path = "../orb-code" }
p256 = { version = "0.13.2", features = ["ecdsa"] }
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
