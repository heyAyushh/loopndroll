[package]
name = "agent-control-plane"
version = "1.1.5"
edition = "2024"
autobins = false

[[bin]]
name = "agent-control-plane"
path = "src/bin/agent-control-plane.rs"

[[bin]]
name = "looper"
path = "src/bin/looper.rs"

[[bin]]
name = "looper-cli"
path = "src/bin/looper-cli.rs"

[[bin]]
name = "looper-server"
path = "src/bin/looper-server.rs"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = { version = "0.7.9", features = ["ws"] }
base64 = "0.22.1"
crossterm = "0.28.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
looper-session-core = { path = "../looper-session-core" }
orb-code = { path = "../orb-code" }
p256 = { version = "0.13.2", features = ["ecdsa"] }
prost = "0.14.1"
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ratatui = "0.30.0"
rcgen = "0.13"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
socket2 = "0.6"
tailscale-localapi = "0.5.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-tungstenite = "0.24.0"
toml = "0.9.8"
tonic = "0.14.6"
tonic-h3 = { version = "0.0.5", default-features = false, features = ["quinn"] }
tonic-prost = "0.14.6"
uuid = { version = "1.18.1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
http-body-util = "0.1.3"
looper-client-core = { path = "../looper-client-core" }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
