[package]
name = "looper-client-core"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = []
uniffi-cli = ["uniffi/cli"]

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dependencies]
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tonic = "0.14.6"
tonic-prost = "0.14.6"
uniffi = "0.31.2"
