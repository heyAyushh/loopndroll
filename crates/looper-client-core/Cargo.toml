[package]
name = "looper-client-core"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = []
uniffi-cli = ["uniffi/cli"]

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dependencies]
prost = "0.14.1"
http-body-util = "0.1.3"
hyper = "1.10.1"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
h3-util = { version = "0.0.5", default-features = false, features = ["quinn"] }
looper-session-core = { path = "../looper-session-core" }
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tonic = "0.14.6"
tonic-h3 = { version = "0.0.5", default-features = false, features = ["quinn"] }
tonic-prost = "0.14.6"
uniffi = "0.31.2"
uuid = { version = "1.18.1", features = ["v4"] }
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
