[package]
name = "orb-code"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
