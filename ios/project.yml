name: LooperCompanion
options:
  createIntermediateGroups: true
packages:
  LooperCompanionCore:
    path: LooperCompanionCore
    group: Packages
  OrbCodeKit:
    path: OrbCodeKit
    group: Packages
  LooperRealtime:
    path: ../swift/LooperRealtime
    group: Packages
settings:
  base:
    SWIFT_VERSION: 6.0
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
targets:
  LooperCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LooperCompanion
        excludes:
          - looper.icon/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.looper.app.ios
        PRODUCT_NAME: Looper
        DEVELOPMENT_TEAM: Z5454ZPPUX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LooperCompanion/Info.plist
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"LooperCompanion/Preview Content\""
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: LooperCompanion/LooperCompanion.Debug.entitlements
          LOOPER_API_BASE_URL: ""
          LOOPER_API_BASE_URLS: ""
          ENABLE_DEBUG_DYLIB: NO
        Release:
          CODE_SIGN_ENTITLEMENTS: LooperCompanion/LooperCompanion.Release.entitlements
          LOOPER_API_BASE_URL: ""
          LOOPER_API_BASE_URLS: ""
    dependencies:
      - package: LooperCompanionCore
      - package: OrbCodeKit
      - package: LooperRealtime
      - sdk: AppIntents.framework
  LooperCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LooperCompanionTests
        excludes:
          - .test-artifacts/**
    dependencies:
      - target: LooperCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.looper.app.ios.tests
        PRODUCT_NAME: LooperCompanionTests
        DEVELOPMENT_TEAM: Z5454ZPPUX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Looper.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Looper"
        BUNDLE_LOADER: "$(TEST_HOST)"
  LooperCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LooperCompanionUITests
    dependencies:
      - target: LooperCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.looper.app.ios.uitests
        PRODUCT_NAME: LooperCompanionUITests
        DEVELOPMENT_TEAM: Z5454ZPPUX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LooperCompanion:
    build:
      targets:
        LooperCompanion: all
        LooperCompanionTests: [test]
        LooperCompanionUITests: [test]
    test:
      config: Debug
      targets:
        - LooperCompanionTests
        - LooperCompanionUITests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
