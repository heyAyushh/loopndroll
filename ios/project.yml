name: LoopndrollCompanion
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  LoopndrollCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LoopndrollCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopndroll.companion
        PRODUCT_NAME: LoopndrollCompanion
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Loopndroll
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LOOPNDROLL_API_BASE_URL: $(LOOPNDROLL_API_BASE_URL)
        DEVELOPMENT_ASSET_PATHS: "\"LoopndrollCompanion/Preview Content\""
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          LOOPNDROLL_API_BASE_URL: http://127.0.0.1:8787
        Release:
          LOOPNDROLL_API_BASE_URL: ""
