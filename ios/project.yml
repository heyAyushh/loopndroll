name: LooperCompanion
options:
  createIntermediateGroups: true
packages:
  OrbCodeKit:
    path: OrbCodeKit
    group: Packages
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  LooperCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LooperCompanion
        excludes:
          - looper.icon/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.looper.app.ios
        PRODUCT_NAME: Looper
        DEVELOPMENT_TEAM: Z5454ZPPUX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LooperCompanion/Info.plist
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"LooperCompanion/Preview Content\""
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: OrbCodeKit
    configs:
      Debug:
        CODE_SIGN_ENTITLEMENTS: LooperCompanion/LooperCompanion.Debug.entitlements
        LOOPER_API_BASE_URL: ""
        LOOPER_API_BASE_URLS: ""
      Release:
        CODE_SIGN_ENTITLEMENTS: LooperCompanion/LooperCompanion.Release.entitlements
        LOOPER_API_BASE_URL: ""
        LOOPER_API_BASE_URLS: ""
